  function dbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open('tsukanshi-official-laws',1);req.onupgradeneeded=()=>req.result.createObjectStore('laws',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  async function dbGet(id){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction('laws','readonly');const r=tx.objectStore('laws').get(id);r.onsuccess=()=>{db.close();res(r.result)};r.onerror=()=>{db.close();rej(r.error)};});}
  async function dbPut(id,xml){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction('laws','readwrite');tx.objectStore('laws').put({id,xml,at:new Date().toISOString()});tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)};});}
  function direct(el,tag){return [...(el?.children||[])].find(x=>x.localName===tag)||null;}
  function textOf(el){return el?.textContent?.trim()||'';}
  function parseLaw(xml){
    const doc=new DOMParser().parseFromString(xml,'application/xml');
    if(doc.querySelector('parsererror'))throw new Error('XML解析失败');
    const main=doc.querySelector('LawBody > MainProvision');
    if(!main)throw new Error('没有找到法令本则，请确认文件来自e-Gov。');
    const articles=[...main.getElementsByTagName('Article')].filter(el=>el.getAttribute('Num'));
    if(!articles.length)throw new Error('没有找到条文。');
    const result=[];
    function items(el,indent=1){
      let out=[];
      for(const ch of [...el.children]){
        if(/^Item$|^Subitem[1-9]$/.test(ch.localName)){
          const title=textOf([...ch.children].find(n=>n.localName.endsWith('Title')));
          const sentence=textOf([...ch.children].find(n=>n.localName.endsWith('Sentence')));
          if(title||sentence)out.push({kind:'item',indent,text:(title+'　'+sentence).trim()});
          out=out.concat(items(ch,indent+1));
        }
      }
      return out;
    }
    for(const el of articles){
      const number=el.getAttribute('Num');
      const title=textOf(direct(el,'ArticleTitle'))||articleLabel(number);
      const caption=textOf(direct(el,'ArticleCaption')).replace(/[（）]/g,'');
      const lines=[];
      for(const p of [...el.children].filter(x=>x.localName==='Paragraph')){
        const n=textOf(direct(p,'ParagraphNum'));
        const sent=textOf(direct(p,'ParagraphSentence'));
        if(sent)lines.push({kind:'para',indent:0,text:(n?n+'　':'')+sent});
        lines.push(...items(p));
      }
      result.push({number,title,caption,lines,searchText:(title+' '+caption+' '+lines.map(x=>x.text).join(' ')).toLowerCase()});
    }
    return {articles:result,loadedAt:new Date().toISOString()};
  }
  async function loadLaw(id,force=false){
    if(lawRequests[id])return;
    if(lawCache[id]&&!force)return;
    lawRequests[id]=true;lawErrors[id]='';
    try{
      if(!force){try{const cached=await dbGet(id);if(cached){lawCache[id]=parseLaw(cached.xml);lawCache[id].loadedAt=cached.at; if(state.lawId===id)renderLaw();return;}}catch(e){console.warn('Cache unavailable',e)}}
      const law=lawById(id);
      const r=await fetch(`https://laws.e-gov.go.jp/api/1/lawdata/${encodeURIComponent(law.lawId)}`,{method:'GET',mode:'cors'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const xml=await r.text();const parsed=parseLaw(xml);lawCache[id]=parsed;
      try{await dbPut(id,xml)}catch(e){console.warn('Cache unavailable',e)}
      if(force)toast(`${law.name}：已更新官方法令正文`);
    }catch(e){lawErrors[id]=e.message||String(e);if(force)toast('更新失败，请检查网络或使用导入功能。');}
    finally{delete lawRequests[id];if(state.lawId===id)renderLaw();}
  }

      if(ok){
        correct++;
        const prev=store.wrong[q.id];
        if(prev){const nextLevel=prev.level+1;if(nextLevel>=reviewIntervals.length)delete store.wrong[q.id];else scheduleReview(q,id,nextLevel);}
      }else scheduleReview(q,id,0);
    }
    store.quizResults.push({lessonId:id,correct,total:questions.length,at:new Date().toISOString()});
    state.quizFinished=true;state.quizResult={correct,total:questions.length};persist();renderQuiz(id);toast('本次练习成绩已保存。');
  }
  function renderReview(){
    const wrong=Object.values(store.wrong).sort((a,b)=>new Date(a.next)-new Date(b.next));const due=dueWrong();const visible=state.reviewMode==='due'?due:wrong;
    const results=[...store.quizResults].reverse().slice(0,8);
    const body=`<div class="eyebrow">REVIEW & SPACED REPETITION</div><h1 class="h1">错题与复习</h1><p class="sub">按 1 / 3 / 7 / 14 / 30 天安排复习。你原来的正式每日成绩单独保留，App 内练习成绩另行记录。</p><div class="stat-row"><div class="card stat-card"><div class="stat-label">待复习错题</div><div class="stat-value">${due.length}</div></div><div class="card stat-card"><div class="stat-label">错题本总数</div><div class="stat-value">${wrong.length}</div></div><div class="card stat-card"><div class="stat-label">App练习次数</div><div class="stat-value">${store.quizResults.length}</div></div></div><div class="section-head"><h2 class="h2">间隔复习</h2><div class="topic-filter" style="margin:0"><button class="chip ${state.reviewMode==='due'?'active':''}" data-review="due">今日到期</button><button class="chip ${state.reviewMode==='all'?'active':''}" data-review="all">全部错题</button></div></div><div class="mini-list">${visible.length?visible.map(w=>`<div class="card pad"><div class="row between"><span class="tag gold">Day ${w.lessonId}</span><span class="small muted">下次 ${new Date(w.next).toLocaleDateString('ja-JP')}</span></div><h3 style="font-size:14px;margin:12px 0">${esc(w.question)}</h3><button class="btn minor ghost" data-reviewquestion="${w.id}">复习这题 →</button></div>`).join(''):'<div class="card empty"><h3>目前没有到期错题</h3><p>先在任意课程中完成原创练习，错题会自动加入复习表。</p><button class="btn" data-nav="#courses">选择课程 →</button></div>'}</div><div class="section-head"><h2 class="h2">练习记录</h2><small>只记录在本 App 内完成的练习</small></div>${results.length?`<div class="card pad"><table class="table"><thead><tr><th>日期</th><th>课程</th><th>结果</th></tr></thead><tbody>${results.map(r=>`<tr><td>${new Date(r.at).toLocaleDateString('ja-JP')}</td><td>Day ${r.lessonId}</td><td>${r.correct}/${r.total}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">尚无 App 内练习记录。</p>'}<div class="section-head"><h2 class="h2">既有课程历史成绩</h2><small>按先前已确认的学习记录整理</small></div><div class="card pad"><table class="table"><thead><tr><th>Day</th><th>课程</th><th>历史得分</th></tr></thead><tbody>${DATA.lessons.map(l=>`<tr><td>${l.id}</td><td><button class="aside-link" style="padding:0" data-lesson="${l.id}">${esc(l.title)}</button></td><td>${l.historical.score}/${l.historical.max}</td></tr>`).join('')}</tbody></table><p class="small muted">Day 1 另有新版演习 10/10；部分早期成绩采用当时已确认的记录口径。</p></div>`;
    chrome('review',body,'错题与复习');
  }
  function renderSettings(){
    const body=`<div class="eyebrow">PREFERENCES & BACKUP</div><h1 class="h1">设置与数据备份</h1><p class="sub">所有学习笔记、进度、收藏和 App 练习成绩目前只保存在此浏览器，不会自动同步到其他设备。</p><div class="grid2 mt"><div class="card pad"><h3 class="h3">阅读设置</h3><p class="muted small">调整讲义和法律正文的字体大小。</p><div class="toolbar mt"><button class="btn ghost" data-action="font-minus">A− 缩小</button><span class="tag">${Math.round(store.fontScale*100)}%</span><button class="btn ghost" data-action="font-plus">A+ 放大</button></div></div><div class="card pad"><h3 class="h3">导出与导入</h3><p class="muted small">换手机或清理浏览器前，请先导出 JSON 备份。</p><div class="toolbar mt"><button class="btn" data-action="export">导出学习记录</button><label class="btn ghost" for="backup-input">导入记录</label><input type="file" id="backup-input" accept="application/json,.json" style="display:none"/></div></div></div><div class="section-head"><h2 class="h2">法令来源与更新</h2></div><div class="card pad"><p class="jp">法令原文は日本政府の e-Gov 法令検索 API から取得します。最初の読み込みにはインターネット接続が必要です。取得した法令はこのブラウザの IndexedDB に保存されます。</p><p class="zh">法律原文来自日本政府 e-Gov 法令 API，首次载入需要网络；成功后会保存在浏览器中。法律会修订，请使用“更新官方正文”核对最新版。API 无法访问时可导入从 e-Gov 下载的 XML。</p><div class="toolbar mt"><a href="https://laws.e-gov.go.jp/" target="_blank" rel="noopener noreferrer" class="btn ghost">e-Gov 法令検索 ↗</a><a href="https://www.customs.go.jp/tsukanshi/index.htm" target="_blank" rel="noopener noreferrer" class="btn ghost">税関 · 通関士試験 ↗</a></div></div><div class="section-head"><h2 class="h2">版本说明</h2></div><div class="card pad"><p class="jp">この版には Day 1～16 の学習テーマを再構成した講義、各章2問の独自演習、法令原文の閲覧・保存・検索機能が含まれています。</p><p class="zh">当前是可运行的第一版：包含 Day1～16 重编讲义、每章2道原创练习和法律电子书。并未逐字导入旧聊天中的全部90分钟课程或官方历年真题；后续可继续扩充。法律原文由官方 API 动态加载，而不是事先伪造内容。</p><button class="btn minor plain mt" data-action="clear" style="color:#a45d52">清空本机学习记录</button></div>`;
    chrome('settings',body,'设置与备份');
  }
  function handleAction(action,button){
    const id=Number(button.dataset.id);
    if(action==='toggle-done'){store.completed=store.completed.includes(id)?store.completed.filter(x=>x!==id):[...store.completed,id];persist();renderLesson(id);toast(store.completed.includes(id)?'已标记本章已读':'已取消已读标记');}
    if(action==='law-refresh'){lawErrors[state.lawId]='';loadLaw(state.lawId,true);renderLaw();}
    if(action==='bookmark'){const key=lawKey(state.lawId,state.article);store.bookmarks=store.bookmarks.includes(key)?store.bookmarks.filter(x=>x!==key):[...store.bookmarks,key];persist();renderLaw();}
    if(action==='font-minus'||action==='font-plus'){store.fontScale=Math.max(.8,Math.min(1.6,Math.round((store.fontScale+(action==='font-plus'?.1:-.1))*10)/10));persist();route();}
    if(action==='copy-article'){const a=lawArticles(state.lawId).find(x=>x.number===state.article);if(a?.lines.length){const content=`${lawById(state.lawId).name} ${a.title} ${a.caption}\n${a.lines.map(x=>x.text).join('\n')}\n出典: https://laws.e-gov.go.jp/law/${lawById(state.lawId).lawId}`;navigator.clipboard?.writeText(content).then(()=>toast('条文已复制'),()=>toast('复制失败，请手动选择文本'));}}
    if(action==='quiz-submit'){const all=lessonById(state.quizLesson).quiz;const q=(state.quizOnlyId?all.filter(x=>x.id===state.quizOnlyId):all)[state.quizIndex];if((state.quizAnswers[q.id]||[]).length){state.quizSubmitted[q.id]=true;renderQuiz(state.quizLesson);}}
    if(action==='quiz-next'){const l=lessonById(state.quizLesson);if(state.quizIndex===(state.quizOnlyId?1:l.quiz.length)-1)finishQuiz(l.id);else{state.quizIndex++;renderQuiz(l.id);}}
    if(action==='quiz-reset'){state.quizLesson=id;state.quizOnlyId=null;state.quizIndex=0;state.quizAnswers={};state.quizSubmitted={};state.quizFinished=false;renderQuiz(id);}
    if(action==='export'){
      const blob=new Blob([JSON.stringify({format:'tsukanshi-study-backup',version:1,exportedAt:new Date().toISOString(),store},null,2)],{type:'application/json'});
      const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='tsukanshi-study-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('已生成备份文件。');
    }
    if(action==='clear'){if(confirm('确定清空此浏览器中的学习记录、笔记和错题吗？此操作无法撤销。')){store=defaultStore();persist();renderSettings();toast('学习记录已清空。')}}
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-nav],[data-lesson],[data-law],[data-quiz],[data-action],[data-filter],[data-coursefilter],[data-article],[data-scroll],[data-review],[data-reviewquestion]');if(!b)return;
    if(b.dataset.nav){nav(b.dataset.nav);return}
    if(b.dataset.lesson){if(!b.disabled&&Number(b.dataset.lesson)>0)toLesson(b.dataset.lesson);return}
    if(b.dataset.law){const [l,a]=b.dataset.law.split(':');toLaw(l,a);return}
    if(b.dataset.quiz){const id=Number(b.dataset.quiz);state.quizOnlyId=null;state.quizLesson=0;ensureQuiz(id);nav('#quiz/'+id);return}
    if(b.dataset.action){handleAction(b.dataset.action,b);return}
    if(b.dataset.filter){state.filter=b.dataset.filter;renderCourses();return}
    if(b.dataset.coursefilter){state.filter=b.dataset.coursefilter;state.search='';nav('#courses');return}
    if(b.dataset.article){state.article=b.dataset.article;toLaw(state.lawId,state.article);return}
    if(b.dataset.scroll){document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}
    if(b.dataset.review){state.reviewMode=b.dataset.review;renderReview();return}
    if(b.dataset.reviewquestion){const qid=b.dataset.reviewquestion;const l=DATA.lessons.find(l=>l.quiz.some(q=>q.id===qid));if(l){state.quizOnlyId=qid;state.quizLesson=0;ensureQuiz(l.id);state.quizIndex=0;nav('#quiz/'+l.id);}return}
  });
  document.addEventListener('change',async e=>{
    const t=e.target;
    if(t.id==='law-select'){state.lawQuery='';state.studiedOnly=true;const l=t.value;const first=Object.keys(DATA.fallbackTitles[l]||{})[0]||'1';toLaw(l,first);return;}
    if(t.id==='studied-only'){state.studiedOnly=t.checked;renderLaw();return;}
    if(t.dataset.choice!==undefined){const all=lessonById(state.quizLesson).quiz;const q=(state.quizOnlyId?all.filter(x=>x.id===state.quizOnlyId):all)[state.quizIndex];if(state.quizSubmitted[q.id])return;const v=Number(t.dataset.choice);const prev=state.quizAnswers[q.id]||[];state.quizAnswers[q.id]=q.type==='multi'?(t.checked?[...new Set([...prev,v])]:prev.filter(x=>x!==v)):[v];renderQuiz(state.quizLesson);return;}
    if(t.id==='law-xml-input'&&t.files?.length){const file=t.files[0];try{const xml=await file.text();const parsed=parseLaw(xml);const expected=lawById(state.lawId).name;const doc=new DOMParser().parseFromString(xml,'application/xml');const title=doc.querySelector('LawTitle')?.textContent?.trim();if(title!==expected)throw new Error(`XML中的法令为「${title||'未知'}」，与当前选择的「${expected}」不一致。`);lawCache[state.lawId]=parsed;lawErrors[state.lawId]='';await dbPut(state.lawId,xml);renderLaw();toast('官方 XML 已导入并缓存。');}catch(err){toast('导入失败：'+err.message)}return;}
    if(t.id==='backup-input'&&t.files?.length){try{const obj=JSON.parse(await t.files[0].text());if(obj.format!=='tsukanshi-study-backup'||!obj.store||!Array.isArray(obj.store.completed))throw new Error('文件格式不符');if(!confirm('导入将覆盖此浏览器现有学习记录，确定继续吗？'))return;store={...defaultStore(),...obj.store};persist();renderSettings();toast('备份已恢复。');}catch(err){toast('导入失败：'+err.message)}return;}
  });
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='course-search'){const s=t.selectionStart;state.search=t.value;renderCourses();const el=document.getElementById('course-search');el?.focus();try{el?.setSelectionRange(s,s)}catch{}return;}
    if(t.id==='law-search'){const s=t.selectionStart;state.lawQuery=t.value;renderLaw();const el=document.getElementById('law-search');el?.focus();try{el?.setSelectionRange(s,s)}catch{}return;}
    if(t.id==='lesson-note'){const id=Number(location.hash.split('/')[1]);store.notes[id]=t.value;persist();return;}
    if(t.id==='law-note'){store.lawNotes[lawKey(state.lawId,state.article)]=t.value;persist();return;}
  });
  window.addEventListener('hashchange',()=>{window.scrollTo(0,0);route()});
  if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  route();
})();

</script>
